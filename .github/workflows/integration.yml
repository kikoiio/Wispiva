name: Optional Ray integration

on:
  push:
    branches:
      - wispiva/openstory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ray-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TMPDIR: ${{ github.workspace }}/.tmp
      RAY_TMPDIR: /var/tmp/ws-ray
      XDG_CONFIG_HOME: ${{ github.workspace }}/.tmp/wispiva-xdg
      WISPIVA_ENV_FILE: ${{ github.workspace }}/.tmp/wispiva-empty.env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Redis server for isolated runtime verification
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Prepare isolated environment and temp paths
        run: |
          mkdir -p "$TMPDIR" "$RAY_TMPDIR" "$XDG_CONFIG_HOME"
          touch "$WISPIVA_ENV_FILE"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Verify Ray runtime and Redis persistence
        run: python scripts/verify-runtime.py
