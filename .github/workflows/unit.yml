name: Unit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
      XDG_CONFIG_HOME: ${{ runner.temp }}/wispiva-xdg
      WISPIVA_ENV_FILE: ${{ runner.temp }}/wispiva-empty.env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Redis server for isolated store tests
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Prepare isolated environment and temp paths
        run: |
          mkdir -p "$TMPDIR" "$XDG_CONFIG_HOME"
          touch "$WISPIVA_ENV_FILE"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run Python and Node unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test
