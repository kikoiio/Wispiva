name: Classic Frontier acceptance
on:
  push:
    branches: [validation/classic-frontier]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v4
      - name: Build shared building shells
        run: |
          mkdir -p .tmp .verify/artifacts
          curl -fL --retry 3 https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o .tmp/blender.tar.xz
          tar -xJf .tmp/blender.tar.xz -C .tmp
          .tmp/blender-4.5.3-linux-x64/blender -b --factory-startup --python world/blender/build_town.py > .verify/artifacts/buildings.log 2>&1
          cp -r world/assets/buildings .verify/artifacts/buildings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: building-exports
          path: .verify/artifacts
          retention-days: 7
  behavior:
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        scenario: [all, civic, wolves, goblins, field, buildings, terrain, thatch, farms, traces]
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: building-exports
          path: .verify/exports
      - name: Prepare engine
        run: |
          mkdir -p .tmp .verify/artifacts
          cp .verify/exports/buildings/*.glb world/assets/buildings/
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o .tmp/godot.zip
          unzip -q .tmp/godot.zip -d .tmp
          chmod +x .tmp/Godot_v4.7.2-stable_linux.x86_64
          ln -s "$PWD/.tmp/Godot_v4.7.2-stable_linux.x86_64" .tmp/godot
          echo "$PWD/.tmp" >> "$GITHUB_PATH"
      - name: Import assets
        run: godot --headless --editor --path world --import > .verify/artifacts/import.log 2>&1
      - name: Verify world behavior
        run: |
          set -o pipefail
          godot --headless --path world --script res://tests/collision.gd 2>&1 | tee .verify/artifacts/collision.log
          ! grep -Eq 'SCRIPT ERROR|ERROR:' .verify/artifacts/collision.log
          godot --headless --path world --script res://tests/rules.gd 2>&1 | tee .verify/artifacts/rules.log
          ! grep -Eq 'SCRIPT ERROR|ERROR:' .verify/artifacts/rules.log
          scenario='${{ matrix.scenario }}'
          if [ "$scenario" = terrain ]; then
            godot --headless --path world --script res://tests/navigation.gd 2>&1 | tee .verify/artifacts/proof.log
            ! grep -Eq 'SCRIPT ERROR|ERROR:' .verify/artifacts/proof.log
          elif [ "$scenario" = all ]; then
            python3 .verify/check.py 2>&1 | tee .verify/artifacts/proof.log
          else
            python3 .verify/check.py "$scenario" 2>&1 | tee .verify/artifacts/proof.log
          fi
          if compgen -G '.verify/artifacts/godot-*.log' >/dev/null; then
            ! grep -Eq 'SCRIPT ERROR|ERROR:' .verify/artifacts/godot-*.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-${{ matrix.scenario }}
          path: .verify/artifacts
          retention-days: 7
  views:
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: building-exports
          path: .verify/exports
      - name: Prepare engine and software display
        run: |
          mkdir -p .tmp .verify/artifacts
          cp .verify/exports/buildings/*.glb world/assets/buildings/
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon0
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o .tmp/godot.zip
          unzip -q .tmp/godot.zip -d .tmp
          chmod +x .tmp/Godot_v4.7.2-stable_linux.x86_64
          ln -s "$PWD/.tmp/Godot_v4.7.2-stable_linux.x86_64" .tmp/godot
          echo "$PWD/.tmp" >> "$GITHUB_PATH"
      - name: Import assets
        run: godot --headless --editor --path world --import > .verify/artifacts/import.log 2>&1
      - name: Capture regions and interiors
        run: |
          unset WAYLAND_DISPLAY
          for view in square wood mine ruins farm ferry inn_upper archive walls granary granary_loft forge; do
            mkdir -p ".verify/artifacts/$view"
            xvfb-run -a godot --path world --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --quit-after 64 -- --capture-only --view="$view" --shots="$PWD/.verify/artifacts/$view" > ".verify/artifacts/$view.log" 2>&1
            if grep -Eq 'SCRIPT ERROR|ERROR:' ".verify/artifacts/$view.log"; then
              cat ".verify/artifacts/$view.log"
              exit 1
            fi
            test -n "$(find ".verify/artifacts/$view" -name '*.png' -print -quit)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-views
          path: .verify/artifacts
          retention-days: 7
