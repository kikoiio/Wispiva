name: Browser smoke

on:
  push:
    branches:
      - wispiva/openstory
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PORT: "4173"
      REDIS_URL: redis://127.0.0.1:6379/15
      TMPDIR: ${{ github.workspace }}/.tmp
      RAY_TMPDIR: /var/tmp/ws-ray
      WISPIVA_TICK_TIMEOUT: "120"
      XDG_CONFIG_HOME: ${{ github.workspace }}/.tmp/wispiva-browser-xdg
      WISPIVA_ENV_FILE: ${{ github.workspace }}/.tmp/wispiva-browser-empty.env
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/wispiva-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare isolated synthetic services
        run: |
          mkdir -p "$TMPDIR/browser-artifacts" "$RAY_TMPDIR" "$XDG_CONFIG_HOME"
          touch "$WISPIVA_ENV_FILE"
          sudo apt-get update
          sudo apt-get install -y redis-server fonts-noto-cjk
          sudo service redis-server start
          redis-cli -u "$REDIS_URL" PING
          redis-cli -u "$REDIS_URL" FLUSHDB
      - name: Install project and browser dependencies (CI only)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -e .
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser smoke against the real server
        run: |
          bash scripts/run.sh > "$TMPDIR/browser-artifacts/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill -TERM "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          env -u WAYLAND_DISPLAY npm run test:browser
      - name: Upload synthetic screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/browser-artifacts/
          if-no-files-found: warn
          retention-days: 7
